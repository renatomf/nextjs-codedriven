name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# onnxruntime-node's postinstall downloads the CUDA/TensorRT providers from
# NuGet on Linux x64 (~258 MiB) that the app never ships (TD-41); a network
# blip there failed `npm ci` (2026-10-03). The CPU runtime is in the package.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # Actions pinned by commit SHA (supply chain); Renovate/Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # ADR-001 layer and module rules. Known violations (the legacy code
      # being migrated) are tolerated; any new one fails the build.
      - name: Architecture rules
        run: npm run lint:arch

      # schema.ts and drizzle/ must agree: a schema change without its
      # generated migration fails here (no database needed).
      - name: Migrations match the schema
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --short -- drizzle
            echo "::error::src/db/schema.ts changed without a migration. Run 'npm run db:generate' and commit drizzle/."
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

      # `next build` imports src/lib/db.ts, which requires DATABASE_URL.
      # The pg Pool never connects at build time, so a placeholder is enough;
      # no real secret is used in CI.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # TD-41: Vercel caps a function at 250 MiB. Prints the ONNX functions'
      # size by package to the job summary and fails above 200 MiB traced.
      - name: Function size
        run: npm run measure:functions

  eval:
    name: Analysis eval (dogfooding)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Deterministic part only (RUN_LLM_EVAL is unset): no model, no cost,
      # no secret. Analyzes this repository and OWASP NodeGoat (downloaded
      # at a pinned commit), writes the numbers to the job summary and fails
      # if precision, recall or the review sample get worse (evals/README.md).
      - name: Analysis eval and quality gate
        run: npm run eval

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Disposable Postgres + pgvector, same major version as Neon (18).
    # No real data and no secrets: every run starts from an empty database
    # and applies the real Drizzle migrations.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:integration

  e2e:
    name: E2E main flow (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Test-only values: disposable database, throwaway secrets, fake LLM.
    # None of them exist anywhere else. `sslmode=disable` because the service
    # container has no TLS (production URLs keep TLS).
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://app:app@localhost:5432/app?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://app:app@localhost:5432/app?sslmode=disable
      AUTH_SECRET: e2e-only-auth-secret-not-used-anywhere-else
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_PLAN_PREMIUM_PRICE_LABEL: "$0/mo"
      E2E_FAKE_LLM: "1"
      E2E_MAIN_FLOW: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npx drizzle-kit migrate

      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
