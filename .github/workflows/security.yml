name: Security

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear without any code change: scan weekly as well.
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scanner:
    name: Dependency vulnerabilities (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails on any known vulnerability not accepted (with an expiry date)
      # in osv-scanner.toml.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=package-lock.json
